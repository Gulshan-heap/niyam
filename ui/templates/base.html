<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Niyam{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Niyam</a>
    <nav>
      <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Ask</a>
      <a href="{{ url_for('evaluation') }}"{% if request.endpoint == 'evaluation' %} aria-current="page"{% endif %}>Evaluation</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

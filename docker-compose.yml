services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: niyam
      POSTGRES_PASSWORD: niyam
      POSTGRES_DB: niyam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyam -d niyam"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NIYAM_DATABASE_URL: postgresql+psycopg://niyam:niyam@db:5432/niyam
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn niyam.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # Healthy only after migrations ran and /health sees the DB.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    environment:
      NIYAM_DATABASE_URL: postgresql+psycopg://niyam:niyam@db:5432/niyam
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: python -m niyam.scheduler

volumes:
  pgdata:
